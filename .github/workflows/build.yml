name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: ./scripts/test.sh

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Verify app
        run: |
          test -d "dist/Pocket Utilities.app"
          file "dist/Pocket Utilities.app/Contents/MacOS/PocketUtilities"
          codesign --verify --deep --strict "dist/Pocket Utilities.app"
